function openRank(){pause();$('#rows').replaceChildren();if(!board.length)$('#rows').innerHTML='<div class="empty">还没有纪录，第一位飞行员会是你吗？</div>';board.forEach((r,i)=>{let row=document.createElement('div');row.className='row';let n=document.createElement('b'),name=document.createElement('span'),s=document.createElement('strong');n.textContent=i<3?['🥇','🥈','🥉'][i]:i+1;name.textContent=r.name;s.textContent=r.score+' 分';row.append(n,name,s);$('#rows').append(row)});$('#leaderboard').showModal()}
$('#rank').onclick=openRank;$('#pause').onclick=e=>{e.stopPropagation();pause()};document.addEventListener('visibilitychange',()=>{if(document.hidden)pause()});window.addEventListener('blur',pause);$('#sound').onclick=()=>{audioUnlocked=true;sound=!sound;if(sound)playMusic();else bgm.pause();$('#sound').textContent=sound?'♪':'♫';$('#sound').setAttribute('aria-label',sound?'关闭声音':'开启声音');toast(sound?'声音已开启':'声音已关闭');tone(800)};document.querySelectorAll('.close').forEach(b=>b.onclick=()=>b.closest('dialog').close());
function select(v){if(!characterIDs.includes(v))return;skin=v;document.querySelectorAll('.choice').forEach(b=>b.classList.toggle('selected',b.dataset.skin===skin))}$('#dress').onclick=()=>{pause();$('#name').value=profile.name||'';select(characterIDs.includes(profile.skin)?profile.skin:characterIDs[0]);$('#profile').showModal()};$('.choices').onclick=e=>{const b=e.target.closest('[data-skin]');if(b)select(b.dataset.skin)};$('#save').onclick=()=>{profile.name=$('#name').value.trim()||'云朵旅人';profile.skin=skin;write('bobo.profile',profile);$('#profile').close();if(state==='home')home()};$('#profile').addEventListener('close',()=>{skin=characterIDs.includes(profile.skin)?profile.skin:characterIDs[0]});
$('#game').addEventListener('pointerdown',e=>{if(e.target.closest('button')||state!=='playing')return;e.preventDefault();flap()});document.addEventListener('keydown',e=>{if(e.code!=='Space'||e.repeat||document.querySelector('dialog[open]')||/INPUT|BUTTON/.test(document.activeElement.tagName))return;e.preventDefault();if(state==='home')start();else if(state==='playing')flap();else if(state==='over'&&performance.now()-finishedAt>500)start();});
function round(x,y,w,h,r,fill){ctx.fillStyle=fill;ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.fill()}function ellipse(x,y,rx,ry,color){ctx.fillStyle=color;ctx.beginPath();ctx.ellipse(x,y,rx,ry,0,0,Math.PI*2);ctx.fill()}function cloud(x,y,s=1){ctx.save();ctx.translate(x,y);ctx.scale(s,s);ellipse(0,0,34,13,'#fffef1d9');ellipse(-13,-8,17,15,'#fffef1d9');ellipse(11,-12,21,18,'#fffef1d9');ctx.restore()}function flower(x,y,s=1){ctx.save();ctx.translate(x,y);ctx.scale(s,s);for(let i=0;i<5;i++){const a=i*Math.PI*2/5;ellipse(Math.cos(a)*5,Math.sin(a)*5,4,4,'#fff9e5')}ellipse(0,0,3,3,'#e7bb6b');ctx.restore()}
function bird(t){ctx.save();ctx.translate(birdX,y);ctx.rotate(state==='playing'?Math.max(-.3,Math.min(.65,vy/800)):Math.sin(t*2)*.06);const active=state==='playing'||state==='paused'||state==='over'?runSkin:skin;const img=['playing','paused','over'].includes(state)?runImage:characterImages[active];if(img&&img.complete&&img.naturalWidth){const scale=Math.min(48/img.naturalWidth,58/img.naturalHeight);const w=img.naturalWidth*scale,h=img.naturalHeight*scale;ctx.drawImage(img,-w/2,-h/2,w,h);}ctx.restore()}
function pipe(p){const gap=p.gap,bottom=p.top+gap;round(p.x, -20,64,p.top+20,13,'#8dbda0');round(p.x+7,-20,12,p.top+12,7,'#b5d8b5');round(p.x-5,p.top-23,74,24,9,'#a5cdac');round(p.x,bottom,64,H-bottom,13,'#8dbda0');round(p.x+7,bottom+10,12,H-bottom,7,'#b5d8b5');round(p.x-5,bottom,74,24,9,'#a5cdac');flower(p.x+47,p.top-12,.7);flower(p.x+18,bottom+12,.7);ellipse(p.x+25,bottom+44,2,3,'#638f73');ellipse(p.x+40,bottom+44,2,3,'#638f73');ctx.strokeStyle='#638f73';ctx.lineWidth=1.4;ctx.beginPath();ctx.arc(p.x+32,bottom+47,4,0,Math.PI);ctx.stroke()}
function render(t){ctx.clearRect(0,0,W,H);const grad=ctx.createLinearGradient(0,0,0,H);grad.addColorStop(0,'#c4e8e1');grad.addColorStop(1,'#f2f2d8');ctx.fillStyle=grad;ctx.fillRect(0,0,W,H);ellipse(320,93,31,31,'#fff0be');ellipse(312,91,2,3,'#d1b87c');ellipse(326,91,2,3,'#d1b87c');for(let i=0;i<5;i++)cloud(((i*119-world*.18+80)%650+650)%650-80,120+(i%3)*90,.65+(i%2)*.35);ctx.strokeStyle='#fffdf144';ctx.lineWidth=10;ctx.beginPath();ctx.arc(200,615,170,Math.PI,0);ctx.stroke();ellipse(70,655,210,135,'#c5ddbd');ellipse(330,670,230,154,'#d7e4bc');for(let i=0;i<8;i++){let x=((i*69-world*.35)%560+560)%560-40;ellipse(x,580+(i%3)*12,16,28,'#b9d2b0')}pipes.forEach(pipe);round(0,610,W,40,0,'#e6e9c5');round(0,610,W,7,0,'#b3cca3');for(let i=0;i<15;i++)flower(((i*34-world*.7)%510+510)%510-40,630+(i%2)*9,.65);for(const p of particles){ctx.globalAlpha=p.life/.55;ellipse(p.x,p.y,3,3,'#fffce6')}ctx.globalAlpha=1;if(state==='home')y=330+Math.sin(t*2)*8;bird(t)}
function update(dt){if(state!=='playing')return;elapsed+=dt;world+=125*dt;vy+=950*dt;y+=vy*dt;spawn-=dt;if(spawn<=0){const gap=Math.max(166,205-score*1.4),top=85+Math.random()*(440-gap);pipes.push({x:W+15,top,gap,passed:false});spawn=1.7}const speed=Math.min(175,130+score*1.3);for(const p of pipes){p.x-=speed*dt;if(!p.passed&&p.x+69<birdX-radius){p.passed=true;score++;$('#score').textContent=score;tone(960,.12)}if(birdX+radius>p.x-5&&birdX-radius<p.x+69&&(y-radius<p.top||y+radius>p.top+p.gap)){end();return}}pipes=pipes.filter(p=>p.x>-80);if(y+radius>=610||y-radius<=0){end();return}particles.forEach(p=>{p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt});particles=particles.filter(p=>p.life>0)}
function resize(){const dpr=Math.min(devicePixelRatio||1,3);canvas.width=Math.round(canvas.clientWidth*dpr);canvas.height=Math.round(canvas.clientHeight*dpr);ctx.setTransform(canvas.width/W,0,0,canvas.height/H,0,0)}new ResizeObserver(resize).observe(canvas);function frame(time){const dt=Math.min((time-(last||time))/1000,.035);last=time;update(dt);render(time/1000);requestAnimationFrame(frame)}
let pendingConfig=null,configRevision=null,syncing=false,audioUnlocked=false;const bgm=new Audio();bgm.loop=true;bgm.preload='none';let musicURL='';
function playMusic(){if(sound&&audioUnlocked&&musicURL&&!document.hidden)bgm.play().catch(()=>{})}
function syncMusic(music){const url=music?.url||'';if(url!==musicURL){bgm.pause();musicURL=url;if(url){bgm.src=url;bgm.load()}else{bgm.removeAttribute('src');bgm.load()}}if(music)bgm.volume=music.volume;playMusic()}
function applyConfig(config){characterIDs=config.characters.map(c=>c.id);const next={};for(const c of config.characters){const old=characterImages[c.id];if(old&&old.getAttribute?.('src')===c.image)next[c.id]=old;else{const img=new Image();img.src=c.image;next[c.id]=img}}characterImages=next;if(!characterIDs.includes(profile.skin)){profile.skin=characterIDs[0];write('bobo.profile',profile)}if(!characterIDs.includes(skin))skin=profile.skin;const choices=$('.choices');choices.replaceChildren();for(const c of config.characters){const b=document.createElement('button');b.className='choice';b.dataset.skin=c.id;b.setAttribute('aria-label','选择'+c.name);const img=document.createElement('img');img.src=c.image;img.alt=c.name;const label=document.createElement('small');label.textContent=c.name;b.append(img,label);choices.append(b)}select(skin);if(state==='home')home()}
async function syncConfig(){if(syncing||document.hidden)return;syncing=true;try{const res=await fetch("https://cloud-bobo-flap-261111.dcj137137.chatgpt.site/api/config",{cache:'no-store',signal:AbortSignal.timeout(7000)});if(!res.ok)return;const config=await res.json();for(const c of config.characters||[])c.image=new URL(c.image,'https://cloud-bobo-flap-261111.dcj137137.chatgpt.site').href;if(config.music)config.music.url=new URL(config.music.url,'https://cloud-bobo-flap-261111.dcj137137.chatgpt.site').href;if(!config?.characters?.length||typeof config.revision!=='string')return;if(config.revision!==configRevision){configRevision=config.revision;syncMusic(config.music);applyConfig(config)}}catch{}finally{syncing=false}}
document.addEventListener('visibilitychange',()=>{if(document.hidden)bgm.pause();else{syncConfig();playMusic()}});
home();resize();requestAnimationFrame(frame);syncConfig();setInterval(syncConfig,3000);
})();
